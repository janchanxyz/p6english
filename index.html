<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#ff8fc5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="小六英文拼字 — 每日 10 個字，睇圖填字母，適合香港小學小六"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>小六英文拼字 · p6english</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-emoji" aria-hidden="true">✏️</span>
          <div>
            <h1>小六英文拼字</h1>
            <p class="brand-sub">Primary 6 Spelling</p>
          </div>
        </div>
        <div class="date-pill" id="datePill">—</div>
      </header>

      <main id="main" class="main"></main>

      <footer class="site-foot">
        <p>
          詞彙參考
          <a
            href="https://www.edb.gov.hk/en/curriculum-development/kla/eng-edu/references-resources/resource%20pri_vocab.html"
            target="_blank"
            rel="noopener"
            >香港教育局小學英語詞表</a
          >
          （KS1／KS2）
        </p>
        <p class="muted">p6english.chanplanet.workers.dev</p>
      </footer>
    </div>

    <div id="overlay-report-confirm" class="overlay-confirm" hidden role="dialog" aria-modal="true" aria-labelledby="report-confirm-title">
      <div class="card confirm-card">
        <h2 class="confirm-title" id="report-confirm-title">確認回報？</h2>
        <p class="confirm-body" id="report-confirm-body">確定回報呢張問題相片？回報後會換另一張圖。</p>
        <div class="confirm-actions">
          <button type="button" class="btn btn-danger btn-block" id="btn-report-confirm-ok">確認回報</button>
          <button type="button" class="btn btn-secondary btn-block" id="btn-report-confirm-cancel">取消</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
